COM_NEWSLETTERBRIDGE_PRESET_CATEGORY_DESC="Τα άρθρα αυτής της κατηγορίας είναι διαθέσιμα ως newsletter presets, σύμφωνα με τα δικαιώματα πρόσβασης και επεξεργασίας. Επιλέξτε Καμία για χρήση μόνο των έτοιμων presets. Τα νέα presets αποθηκεύονται ως αδημοσίευτα άρθρα με περιορισμένη πρόσβαση."
