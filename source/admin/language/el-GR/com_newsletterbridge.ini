COM_NEWSLETTERBRIDGE_EMAIL_PREPARE_SNAPSHOT="Το αποθηκευμένο job περιέχει επιλογές επέκτασης που δεν είχαν αποδοθεί πριν την έναρξη. Ακυρώστε το και ελέγξτε τους ήδη σταλμένους παραλήπτες πριν δημιουργήσετε νέα αποστολή."
COM_NEWSLETTERBRIDGE_EMAIL_PREPARE_HELP="Τα κουμπιά επεκτάσεων που εισάγουν ειδικούς κωδικούς χρειάζονται αντίστοιχο ενεργό plugin υποστήριξης email στην ομάδα newsletter. Η απόδοση γίνεται στην προεπισκόπηση, στη δοκιμή και μία φορά στην έναρξη αποστολής, μόνο με δημόσια διαθέσιμο περιεχόμενο."
