COM_NEWSLETTERBRIDGE_DEPENDENCY_API="Λείπουν απαραίτητα models, helpers ή μέθοδοι του Simple Newsletter. Η λειτουργία του bridge δεν μπορεί να συνεχιστεί."
COM_NEWSLETTERBRIDGE_COMPAT_FILES_WARNING="Τα κρίσιμα αρχεία του Simple Newsletter διαφέρουν από την ελεγμένη έκδοση. Το bridge παραμένει διαθέσιμο εφόσον υπάρχουν οι απαραίτητες λειτουργίες, αλλά η συμπεριφορά αυτής της εγκατάστασης δεν έχει επαληθευτεί."
