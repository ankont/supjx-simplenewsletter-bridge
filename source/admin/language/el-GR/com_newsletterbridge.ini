COM_NEWSLETTERBRIDGE_DEPENDENCY_STORAGE="Οι πίνακες του Simple Newsletter πρέπει να χρησιμοποιούν InnoDB για ασφαλή διαχείριση αποστολών."
COM_NEWSLETTERBRIDGE_COMPAT_VERSION_WARNING="Η έκδοση του Simple Newsletter είναι διαφορετική από την ελεγμένη 1.3.0 ή δεν αναγνωρίζεται από τα metadata. Το bridge παραμένει διαθέσιμο εφόσον υπάρχουν οι απαραίτητες λειτουργίες. Ελέγξτε τη συμβατότητα πριν από αποστολές."

COM_NEWSLETTERBRIDGE_PLACEHOLDERS_HELP="Μπορείτε να προσθέσετε τους παρακάτω κωδικούς στο κείμενο. Κατά την αποστολή θα αντικατασταθούν αυτόματα με τα αντίστοιχα στοιχεία, όπως το όνομα και το email του συνδρομητή, οι σύνδεσμοι διαγραφής και επιβεβαίωσης, το όνομα και η διεύθυνση του ιστοτόπου και η ημερομηνία."

COM_NEWSLETTERBRIDGE_CONFIGURATION="Ρυθμίσεις ενημερωτικών δελτίων"
COM_NEWSLETTERBRIDGE_EMAIL_PREPARE_UNRESOLVED="Το περιεχόμενο περιέχει επιλογές επέκτασης που δεν αποδόθηκαν. Εγκαταστήστε και ενεργοποιήστε την αντίστοιχη υποστήριξη email στην ομάδα plugins newsletter και ελέγξτε την επιλογή."
COM_NEWSLETTERBRIDGE_EMAIL_PREPARE_FAILED="Μια επέκταση δεν μπόρεσε να προετοιμάσει το περιεχόμενο για email. Ελέγξτε τις ενεργές επεκτάσεις της ομάδας newsletter. Δεν ξεκίνησε νέα αποστολή."
COM_NEWSLETTERBRIDGE_EMAIL_PREPARE_INVALID="Μια επέκταση email επέστρεψε μη συμβατό αποτέλεσμα ή άλλαξε την πολιτική προετοιμασίας. Η ενέργεια διακόπηκε."
